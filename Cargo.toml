[package]
name = "cpns"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Pins: sealed fingerprints of restricted profile fields"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/cpns.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[dependencies]
sha2 = "0.11"
subtle = "2.6"
zeroize = "1.9"

[features]
default = ["storage"]
storage = ["dep:crlt"]
wasm = ["dep:getrandom", "getrandom/wasm_js"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
crlt = { git = "https://git.corbet.ch/corbet-libre/crlt.git", branch = "main", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
